name: Test evaluation pipeline

on:
  pull_request:
    paths:
      - "evaluation-pipeline/**"
      - "retrospective-data/**"
      - "demo-models/**"
      - "model-output/**"
      - "model-metadata/**"
      - "evaluation-output/**"
      - ".github/workflows/test-evaluation-pipeline.yml"
  push:
    branches: [main]
    paths:
      - "evaluation-pipeline/**"
      - "retrospective-data/**"
      - "demo-models/**"
      - "model-output/**"
      - "model-metadata/**"
      - "evaluation-output/**"
      - ".github/workflows/test-evaluation-pipeline.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: evaluation-pipeline/pyproject.toml
      - name: Install evaluation pipeline
        run: python -m pip install -e evaluation-pipeline
      - name: Run development tests
        run: python -m unittest discover -s evaluation-pipeline/tests -v
      - name: Verify demonstration forecasts are reproducible
        run: python demo-models/generate_demo_forecasts.py --check
      - name: Verify current fixed inputs
        run: |
          match-retrospective-forecasts --allow-empty \
            --output /tmp/matched-forecasts.csv \
            --report /tmp/match-report.json
          score-retrospective-point-forecasts --allow-empty \
            --input /tmp/matched-forecasts.csv \
            --output-root /tmp/point-scores
          build-retrospective-qra --allow-empty \
            --input /tmp/matched-forecasts.csv \
            --output-root /tmp/qra
          score-retrospective-qra --allow-empty \
            --qra-input /tmp/qra/qra-forecasts.csv \
            --matched-input /tmp/matched-forecasts.csv \
            --output-root /tmp/qra-scores
      - name: Verify committed demonstration results are reproducible
        run: |
          diff evaluation-output/2025-2026/matched-forecasts.csv /tmp/matched-forecasts.csv
          diff evaluation-output/2025-2026/match-report.json /tmp/match-report.json
          for file in point-errors.csv point-metrics-by-location-horizon.csv point-metrics-by-forecast-kind.csv point-score-report.json; do
            diff "evaluation-output/2025-2026/$file" "/tmp/point-scores/$file"
          done
          for file in qra-forecasts.csv qra-coefficients.csv; do
            python demo-models/compare_numeric_csv.py "evaluation-output/2025-2026/$file" "/tmp/qra/$file"
          done
          for file in qra-skipped-tasks.json qra-report.json; do
            diff "evaluation-output/2025-2026/$file" "/tmp/qra/$file"
          done
          for file in qra-scores.csv qra-metrics-by-location-horizon.csv; do
            python demo-models/compare_numeric_csv.py "evaluation-output/2025-2026/$file" "/tmp/qra-scores/$file"
          done
          diff evaluation-output/2025-2026/qra-score-report.json /tmp/qra-scores/qra-score-report.json
