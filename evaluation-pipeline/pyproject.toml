[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "swedish-influenza-evaluation"
version = "0.1.0"
description = "Match Swedish Influenza Forecast Hub forecasts to outcomes"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
match-retrospective-forecasts = "influenza_evaluation.match:main"

[tool.setuptools.packages.find]
where = ["src"]
