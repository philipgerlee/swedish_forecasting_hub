model_name: Regularized quantile regression averaging ensemble
model_abbr: qra
model_version: 1.0.0
model_contributors:
  - name: Swedish Influenza Forecast Hub
    affiliation: Chalmers University of Technology, Department of Mathematical Sciences
methods: >-
  L1-regularized quantile regression averaging fitted separately by location,
  forecast horizon and quantile. Regularization is selected by temporally
  ordered expanding-window validation.
